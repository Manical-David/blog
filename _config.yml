# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Manical's Blog
subtitle: 'A place of calmness and serenity'
description: 'Here, I share my experiences and ideas on my life and OI. I hope you can find something useful here. BUT!!! I warn you that you should have a github account first to have a better experience.'
keywords:
author: Manical David
language: zh-cn
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://manical-david.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: true
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: 默认
category_map: true
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: warmpaper

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: https://github.com/Manical-David
  branch: gh-pages
  message: "Site updated: {{ now('YYYY-MM-DD HH:mm:ss') }}"

# The Settings from GitHub
# 导航菜单
menu:
  Home: /
  Archives: /archives

# 个人资料卡片（首页文章列表上方）
profile:
  avatar: /images/avatar.png     # 头像图片路径
  description: "A Student in Secondary School who fell in love with coding"       # 个人简介
  links:                         # 社交链接（可配置任意数量）
    - name: GitHub
      url: https://github.com/Manical-David
      icon: github               # 支持: github, email, website, twitter, rss, bilibili, zhihu
    - name: Email
      url: mailto:sjc158588592851@outlook.com
      icon: email
    - name: Website
      url: https://manical-david.github.io
      icon: website

# 文章目录（右侧边栏）
toc:
  enable: true
  max_depth: 3
  min_depth: 2
  list_number: true

# 数学公式（MathJax v4）— 需 Markdown 渲染器透传 $...$，详见下文「数学公式」
math:
  enable: true

# Waline 评论系统
waline:
  enable: false
  serverURL: 'https://your-server-url'

# 文章摘要链接文字
excerpt_link: Read More

# 页脚版权信息（留空则使用默认）
copyright: "Manical David © 2026. All rights reserved."